<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { color: #24382e; }
    a:hover { color: #1a1917; }
    .eq { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
    .tabular { font-variant-numeric: tabular-nums; }
    .grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      background-size: 120px 120px;
      opacity: 0.38;
      mix-blend-mode: soft-light;
    }
  </style>
</helmet>

<!-- Reference: the overview page as it stands today, reproduced from
     components/eq/bento-art.tsx so the comparison is like-for-like. Five
     translucent layers per tile (blurred orbs, sheen, vignette, grain, and a
     white overlay reaching 96% at the bottom) and four different beiges. -->
<div class="eq" style="width: 1360px; height: 800px; background: #f6f4f1; display: flex; flex-direction: column; color: #1a1917;">

  <div style="height: 68px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 6px 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.58); background: rgba(255,255,255,0.66); box-shadow: 0 0 0 1px rgba(26,25,23,0.05), 0 10px 36px rgba(26,25,23,0.09);">
      <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em; padding-right: 12px;">EQ</span>
      <span style="font-size: 14px; font-weight: 500; color: #ffffff; background: #1a1917; padding: 7px 15px; border-radius: 999px;">Overview</span>
      <span style="font-size: 14px; font-weight: 500; color: #6a6a6a; padding: 0 12px;">Salary</span>
      <span style="font-size: 14px; font-weight: 500; color: #6a6a6a; padding: 0 12px;">Compare</span>
      <span style="font-size: 14px; font-weight: 500; color: #6a6a6a; padding: 0 12px;">Charts</span>
      <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin-left: 6px; border-radius: 999px; background: #1a1917; color: #ffffff;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; border: 1px solid #ddd6cc; color: #6a6a6a;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2.1"/><circle cx="9" cy="16" r="2.1"/></svg>
      </span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 0 60px 16px;">
    <div style="display: grid; height: 716px; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px;">

      <div style="grid-column: span 2; grid-row: span 2; position: relative; overflow: hidden; border-radius: 20px; background: #f2ece4; box-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 1px 0 rgba(255,255,255,0.55) inset, 0 8px 28px rgba(26,25,23,0.09); padding: 24px; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at 72% 22%, rgba(232,212,184,0.82) 0%, rgba(232,212,184,0) 62%), radial-gradient(circle at 28% 68%, rgba(36,56,46,0.09) 0%, rgba(36,56,46,0) 55%), radial-gradient(circle at 88% 72%, rgba(196,165,116,0.22) 0%, rgba(196,165,116,0) 40%); filter: blur(28px);"></div>
        <div style="position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,0.26) 0%, transparent 38%);"></div>
        <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 90% 85% at 50% 40%, transparent 55%, rgba(26,25,23,0.06) 100%);"></div>
        <div class="grain" style="position: absolute; inset: 0;"></div>
        <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.08) 28%, rgba(255,255,255,0.62) 58%, rgba(255,255,255,0.96) 100%);"></div>

        <div style="position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <p style="margin: 0; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.75;">SDE1 · Madrid</p>
          <span style="opacity: 0.6;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16.5h18"/><path d="M6.5 15.5 11 10.5l3.2 3 5.3-6"/><path d="M16.2 7.5h3.3v3.3"/></svg>
          </span>
        </div>
        <div style="position: relative; z-index: 1;">
          <p class="tabular" style="margin: 0 0 8px; font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.03em;">€95.2k</p>
          <p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">Google leads pay · Amazon leads jump</p>
          <span style="display: inline-flex; align-items: center; height: 36px; padding: 0 20px; margin-top: 16px; border-radius: 999px; background: #1a1917; color: #ffffff; font-size: 13px; font-weight: 500;">Open ranking</span>
        </div>
      </div>

      <div style="position: relative; overflow: hidden; border-radius: 20px; background: #f0ebe4; box-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 8px 28px rgba(26,25,23,0.09); padding: 24px; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at 26% 32%, rgba(232,223,212,0.95) 0%, rgba(232,223,212,0) 58%), radial-gradient(circle at 74% 32%, rgba(36,56,46,0.14) 0%, rgba(36,56,46,0) 58%); filter: blur(26px);"></div>
        <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 90% 85% at 50% 40%, transparent 55%, rgba(26,25,23,0.06) 100%);"></div>
        <div class="grain" style="position: absolute; inset: 0;"></div>
        <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.08) 28%, rgba(255,255,255,0.62) 58%, rgba(255,255,255,0.96) 100%);"></div>
        <div style="position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <p style="margin: 0; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.75;">Compare</p>
          <span style="opacity: 0.6;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M4.5 7h15"/><path d="M4.5 7 1.9 13h5.2z"/><path d="M19.5 7 16.9 13h5.2z"/><path d="M8.5 20h7"/></svg>
          </span>
        </div>
        <div style="position: relative; z-index: 1;">
          <p class="tabular" style="margin: 0 0 6px; font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.03em;">20</p>
          <p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">companies shortlisted</p>
          <span style="display: inline-flex; align-items: center; height: 34px; padding: 0 18px; margin-top: 16px; border-radius: 999px; background: #1a1917; color: #ffffff; font-size: 12.5px; font-weight: 500;">Open compare</span>
        </div>
      </div>

      <div style="position: relative; overflow: hidden; border-radius: 20px; background: linear-gradient(148deg, #f8f5f0 0%, #e9e0d5 100%); box-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 8px 28px rgba(26,25,23,0.09); padding: 24px; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at 88% 16%, rgba(36,56,46,0.12) 0%, rgba(36,56,46,0) 55%), radial-gradient(circle at 8% 84%, rgba(196,165,116,0.16) 0%, rgba(196,165,116,0) 50%); filter: blur(24px);"></div>
        <div style="position: absolute; inset: 0;">
          <svg width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" fill="none" aria-hidden>
            <path d="M16 248 C64 208 112 228 160 188 C208 148 256 168 304 128 C340 98 364 78 384 58" stroke="rgba(36,56,46,0.42)" stroke-width="2.25" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.26) 0%, transparent 38%);"></div>
        <div class="grain" style="position: absolute; inset: 0;"></div>
        <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.08) 28%, rgba(255,255,255,0.62) 58%, rgba(255,255,255,0.96) 100%);"></div>
        <div style="position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <p style="margin: 0; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.75;">Charts</p>
          <span style="opacity: 0.6;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"><rect x="4.4" y="10" width="3.6" height="9.5" rx="1"/><rect x="10.2" y="5.6" width="3.6" height="13.9" rx="1"/><rect x="16" y="13" width="3.6" height="6.5" rx="1"/></svg>
          </span>
        </div>
        <div style="position: relative; z-index: 1;">
          <p style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.015em;">Pay and growth</p>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
